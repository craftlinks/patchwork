<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>patchwork</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #1c1e29;
        }
        canvas {
            display: block;
            outline: none;
            width: 100%;
            height: 100%;
            /* A finger is the app's, not the page's: no scroll, zoom, or pointercancel. */
            touch-action: none;
        }
    </style>
</head>
<body>
    <canvas id="surface" tabindex="0"></canvas>
    <script type="module" src="shell.js"></script>
</body>
</html>
